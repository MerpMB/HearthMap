      - {name: "NBTC infrastructure context", registry_id: telecom-nbtc-coverage, status: "REJECTED for grid use (aggregates)"}
      - {name: "Ookla open data", registry_id: telecom-ookla-open-data, status: "CANDIDATE, deferred"}
    known_limitations: ["mobile coverage and speed tests are not fixed fiber", "provider maps are indicative", "no open spatial fiber layer is known"]
    required_resolution: "address"
    freshness_expectation: "at purchase"
    acquisition_difficulty: HIGH
    legal_licensing: "provider terms; no scraping"
    proposed_milestone: "M3-parcel-verification-protocol"
  - id: EF-08
    name: Road access - network, legal, all-weather, surface
    purpose: Keep five road concepts separate; extend regional evidence only where it can responsibly help.
    current_state: "OSM routing covers part of network accessibility; DRR links validate OSM presence; legal, all-weather and surface evidence is absent."
    candidate_sources:
      - {name: "OSM roads with surface/tracktype tags", registry_id: osm-overpass-aoi, status: "ACQUIRED (tracks and services absent)"}
      - {name: "DRR / DOH road inventories", registry_id: roads-official-doh-drr, status: "ACQUIRED as validation only"}
      - {name: "Title/cadastral and road-status records", registry_id: null, status: "PARCEL_VERIFICATION"}
    known_limitations: ["surface tags are sparse", "free-flow time is not wet-season usability", "legal access is a parcel fact"]
    required_resolution: "parcel and final access road"
    freshness_expectation: "at purchase"
    acquisition_difficulty: MEDIUM
    legal_licensing: "OSM ODbL; cadastral data access to confirm"
    proposed_milestone: "M3-parcel-verification-protocol"
