      - {name: "Groundwater department regional potential maps and well records (aquifer potential, depth, yield, quality)", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Local-authority water-service records", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
    known_limitations: ["regional groundwater potential is context only", "yield, quality, depth and drilling legality are parcel facts", "village systems are rarely mapped"]
    required_resolution: "parcel / field"
    freshness_expectation: "dry-season verification"
    acquisition_difficulty: HIGH
    legal_licensing: "to confirm per source"
    proposed_milestone: "M3-parcel-verification-protocol (+ M2D-groundwater-context optional)"
  - id: EF-07
    name: Fixed fiber availability
    purpose: Verify actual fixed fiber at the address; mobile coverage never satisfies it.
    current_state: "Telecom is DEFERRED; NBTC publishes aggregates; Ookla tiles are crowd-sourced speed tests."
    candidate_sources:
