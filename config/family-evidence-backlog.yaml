# M2C evidence acquisition backlog (data for docs/research/m2c-evidence-backlog.md; the markdown is generated).
#
# Candidate sources are LISTED, not verified or acquired: verifying them (and their licences) is the job of the proposed milestone.
# A source appearing here is never acquired merely because it is listed. Priority is derived from the requirement entries in
# config/family-evaluability.yaml (best of the entries that cite the family), never typed here.
schema_version: 1
version: "0.1.0"
families:
  - id: EF-01
    name: Education register freshness
    purpose: Replace the stale 2021/2020 education register with a current, authoritative institution list (levels, status, coordinates).
    current_state: "DOPA gis-02 (budget year 2564) is the stale fallback; OBEC 2563 class ranges classify about half of schools; the MOE central CKAN register is temporarily unreachable; the MOE Data Virtualization report is a Power BI embed without export or coordinates."
    candidate_sources:
      - {name: "MOE central CKAN per-school resource (dataset_04_25660427)", registry_id: schools-official, status: "EXISTS_TEMPORARILY_UNREACHABLE - manual import path ready"}
      - {name: "DLA school / child-development-centre list 2569", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "OPEC private-school evidence", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Current vocational institution data", registry_id: null, status: "CANDIDATE_UNVERIFIED (vocational is currently IRRELEVANT)"}
      - {name: "OSM schools (cross-check only)", registry_id: osm-facilities-aoi, status: "ACQUIRED, validation only"}
    known_limitations: ["no single current register is reachable", "a federated register would mix sources of different vintage and authority; roles must stay explicit", "current-school presence needs an enrolment signal"]
    required_resolution: "point, with official id, level fields, status and coordinate confidence"
    freshness_expectation: "current academic year"
    acquisition_difficulty: MEDIUM
    legal_licensing: "MOE/OBEC terms to confirm per source; OSM is ODbL and stays separate"
    proposed_milestone: "M2D-education-current-register"
  - id: EF-02
    name: Healthcare currency and capability verification path
    purpose: Keep facility existence/type/status current and define how capability (emergency, trauma, ICU) would be verified if the owner ever requires it.
    current_state: "MoPH public ArcGIS layers (2026 edit, mostly 2023-dated records) give location, type, level and status for government facilities; no capability fields; HCODE is browser-gated."
    candidate_sources:
      - {name: "MoPH public hospital layers (update68/update69)", registry_id: facility-moph-hospital-update68, status: "ACQUIRED"}
      - {name: "MoPH HCODE export (manual)", registry_id: health-facilities-moph, status: "EXISTS_AGENT_BLOCKED - manual import path ready"}
      - {name: "Hospital-level / capability statements from the hospitals themselves", registry_id: null, status: "FIELD_VERIFICATION"}
    known_limitations: ["government facilities only", "a facility class is not a capability", "no licence statement on the public layer"]
    required_resolution: "point; facility-level capability statements only if requirements are set"
    freshness_expectation: "annual or better"
    acquisition_difficulty: LOW
    legal_licensing: "public service without stated terms; HCODE terms to confirm"
    proposed_milestone: "M2D-health-refresh (only if HCODE becomes available)"
  - id: EF-03
    name: Town-services accessibility
    purpose: Give 'town services within about 35 minutes' an operational meaning and evidence.
    current_state: "No town-services layer or definition exists; university and hospital times are not a proxy."
    candidate_sources:
      - {name: "OSM POIs (supermarket, pharmacy, bank/ATM, fuel, market, municipal offices)", registry_id: osm-facilities-aoi, status: "ACQUIRED for schools/health only; other POIs not acquired"}
      - {name: "Department of Energy Business fuel-station registry", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Bank of Thailand / bank branch and ATM locators", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Department of Business Development establishment registry", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Municipal / DOPA administrative-centre points", registry_id: places-dopa-gis02, status: "ACQUIRED (2021)"}
    known_limitations: ["the bundle must be defined and approved by the owner before any evidence is built", "OSM business completeness and freshness vary", "commercial POI datasets carry restrictive licences", "routing from cell centres to towns needs a defined set of destinations"]
    required_resolution: "point destinations routed on the frozen network"
    freshness_expectation: "within about two years; businesses close often"
    acquisition_difficulty: MEDIUM
    legal_licensing: "OSM ODbL; commercial POIs generally not usable"
    proposed_milestone: "M2D-town-services"
  - id: EF-04
    name: Land-price evidence
    purpose: Evaluate the bare-land price ceiling (THB 500,000) responsibly, per unit area and with market-value semantics kept honest.
    current_state: "No land-price evidence has been acquired."
    candidate_sources:
      - {name: "Treasury Department appraised land values", registry_id: land-value-treasury-appraisal, status: "NEEDS_RESEARCH"}
      - {name: "Land Department transaction / reference prices", registry_id: null, status: "CANDIDATE_UNVERIFIED"}
      - {name: "Listing asking prices (marketplaces)", registry_id: null, status: "CANDIDATE_UNVERIFIED - terms of use must be checked; no scraping is planned"}
    known_limitations: ["an asking price is not a market value", "a total price is meaningless without parcel area", "stale and duplicate listings", "geocoding uncertainty", "appraised values lag and differ from market"]
    required_resolution: "per unit area by zone for candidate comparison; parcel-level price and area for shortlist"
    freshness_expectation: "listings: weeks; appraised values: current appraisal cycle"
    acquisition_difficulty: HIGH
    legal_licensing: "marketplace terms usually forbid scraping; government appraisal terms to confirm"
    proposed_milestone: "M2D-land-price-evidence"
  - id: EF-05
    name: Electricity service context vs parcel connection
    purpose: Keep regional service context separate from parcel connection verification.
    current_state: "PEA Power Map has no verified machine-readable endpoint; every cell is NOT_ASSESSED."
    candidate_sources:
      - {name: "PEA Power Map / planning context", registry_id: electricity-pea, status: "NOT_VERIFIED"}
      - {name: "Settlement / electrification proxies (built-up, night lights)", registry_id: population-grids, status: "NEEDS_RESEARCH"}
      - {name: "Parcel-level PEA confirmation procedure", registry_id: null, status: "FIELD_VERIFICATION"}
    known_limitations: ["PEA planning information creates no obligation to serve", "nearby poles do not prove a connection", "capacity, phase, cost and reliability are out of scope"]
    required_resolution: "parcel"
    freshness_expectation: "at purchase"
    acquisition_difficulty: HIGH
    legal_licensing: "no scraping or reverse-engineering of PEA services"
    proposed_milestone: "M3-parcel-verification-protocol"
  - id: EF-06
    name: Water - PWA, local public, village, groundwater
    purpose: Support the accepted water paths with separate evidence and verification, never collapsing them.
    current_state: "No PWA polygons are published; no local or village system evidence; no groundwater evidence acquired."
