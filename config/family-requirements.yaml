# HearthMap family REQUIREMENTS v0.1 (M2B.0) - USER_REQUIREMENT only.
#
# Populated ONLY with explicit user decisions. No user decision has been given yet, so every value is UNSET.
# UNSET is not a default: it means "the owner has not decided". Nothing here is product truth, and no geographic
# scoring exists (family_suitability_scoring.allowed is false). Fill values in with the owner, then run
#   python scripts/m2b0/build_matrix.py
# which validates them (contradictions are errors, never silently repaired) and refreshes the evidence matrix.
#
# importance values (use these instead of numeric weights during calibration):
#   MUST | STRONG_PREFERENCE | PREFERENCE | NICE_TO_HAVE | IRRELEVANT
# minutes are BASELINE_DRIVE_TIME (free-flow class speeds), not real commute time.
schema_version: 1
version: "0.1.3"
status: FAMILY_REQUIREMENTS_V0_1_CALIBRATED   # calibrated, NOT complete: intentional UNSET values are valid product truth; scoring stays disabled

project_state:
  family_infrastructure_evidence:
    healthcare: adequate_for_calibration
    education: partial_and_stale
    routing: adequate_for_calibration
  requirement_calibration:
    allowed: true
  family_suitability_scoring:
    allowed: false
  reason: current education register remains incomplete

# Hazard (M1E) semantics stay separate from preferences: a willingness to engineer or improve a site never overrides, cancels or
# softens a hazard action (e.g. DEPRIORITIZE, flood avoidance, landslide avoidance), and family access never offsets one.
hazard_contract:
  m1e_actions_immutable: true
  site_improvement_willingness_overrides_hazard_actions: false
  family_access_offsets_hazard_actions: false
  terrain_preference_overrides_hazard_actions: false   # a preferred rolling site never overrides landslide/flood/seismic actions, deprioritization or verification

education:
  kindergarten:
    importance: PREFERENCE
    preferred_max_drive_minutes: 15
    absolute_max_drive_minutes: 25
    minimum_choices_within_preferred_time: UNSET
  primary:
    importance: MUST
    preferred_max_drive_minutes: 15
    absolute_max_drive_minutes: 25
    minimum_choices_within_preferred_time: UNSET
  lower_secondary:
    importance: MUST
    preferred_max_drive_minutes: 20
    absolute_max_drive_minutes: 30
    minimum_choices_within_preferred_time: UNSET
  upper_secondary:
    importance: STRONG_PREFERENCE
    preferred_max_drive_minutes: 25
    absolute_max_drive_minutes: 40
    minimum_choices_within_preferred_time: UNSET
  vocational:     # INPUT PASS 3: IRRELEVANT to this home-location decision (no reward for proximity, no penalty for distance, not used in evaluation)
    importance: IRRELEVANT
  university:     # INPUT PASS 3: IRRELEVANT to this home-location decision (not a statement about life in general)
    importance: IRRELEVANT
    preferred_max_drive_minutes: UNSET

healthcare:   # no trauma/emergency capability is requested here: that is a future facility-verification question
  primary_healthcare:   # INPUT PASS 3: a preference, not a hard gate
    importance: PREFERENCE
    preferred_max_drive_minutes: 15
    absolute_max_drive_minutes: UNSET
  hospital:
    importance: MUST
    preferred_max_drive_minutes: 20
    absolute_max_drive_minutes: 35
  regional_or_referral_hospital:
    importance: STRONG_PREFERENCE
    preferred_max_drive_minutes: 45
    absolute_max_drive_minutes: 75

redundancy:   # INPUT PASS 1: the owner wants no fixed minimum number of schools. Multiple reachable alternatives are shown as DECISION CONTEXT (counts and travel times) for comparison; nothing here gates or penalises a location with a single option. Numeric minimums stay UNSET on purpose.
  # resilience should not depend only on the nearest facility; a requirement, not a score
  number_of_primary_schools_within_time:
    importance: UNSET
    minimum_count: UNSET
    within_minutes: UNSET
  number_of_secondary_schools_within_time:
    importance: UNSET
    minimum_count: UNSET
    within_minutes: UNSET
  number_of_hospitals_within_time:
    importance: UNSET
    minimum_count: UNSET
    within_minutes: UNSET

road_access:
  major_road:
    importance: UNSET
    maximum_baseline_drive_time_to_major_road: UNSET   # no major-road time or distance was given; none is inferred
  # INPUT PASS 2 (delegated to the proposed baseline by the owner):
  legal_vehicle_access:             # the parcel must have legitimate / legal access (parcel-level verification)
    required: true
    importance: MUST
  all_weather_vehicle_access:       # a normal vehicle must be able to reach the parcel year-round, including the wet season
    required: true
    importance: MUST
  tolerate_unpaved_local_access: true   # the FINAL access road need not be paved; gravel/local access is fine if it stays practically usable year-round
  route_redundancy_importance: UNSET

utilities:    # tolerance for uncertainty, not a claim that utility evidence is complete
  electricity:   # INPUT PASS 3: actual usable public/grid electricity at the parcel is required. Missing regional evidence means VERIFY, never reject.
    grid_service_required: true
    importance: MUST
    verification_stage: BEFORE_PURCHASE
    must_be_verified_before_purchase: true
    tolerate_regional_uncertainty_during_screening: true
    # not requirements (and not inferred): connection capacity, transformer capacity, phase, connection cost, service reliability
  water:       # INPUT PASS 2: PWA is not required; village / municipal / local-government water is acceptable ONLY once field-verified as reliable.
    importance: MUST                              # a verified, reliable supply is a condition of purchase
    must_be_verified_before_purchase: true
    accept_non_PWA_system_if_field_verified: true
    require_municipal_or_PWA_service: false
    well_water_acceptable: true                   # INPUT PASS 3: groundwater/well water may be the primary source. This does NOT mean groundwater exists, yields enough, is potable, may legally be drilled, or is affordable: all parcel-level verification
  telecom:     # INPUT PASS 2: actual fixed fiber internet is required. Missing evidence never weakens this MUST.
    minimum_requirement: FIXED_FIBER   # NONE | MOBILE_VOICE | MOBILE_DATA | FIXED_BROADBAND | FIXED_FIBER
    importance: MUST
    verification_stage: BEFORE_PURCHASE   # SCREENING | SHORTLIST | PARCEL_PURCHASE | BEFORE_PURCHASE
    substitutes_not_accepted: [MOBILE_4G, MOBILE_5G, FIXED_WIRELESS, SATELLITE]   # do not satisfy fiber unless the owner changes it

urban_access:
  preferred_drive_time_to_town_services: 35
  preferred_drive_time_to_town_services_importance: STRONG_PREFERENCE
  # no absolute maximum town-access time was given; absolute_max_drive_time_to_major_city_services is a different item and stays UNSET
  absolute_max_drive_time_to_major_city_services: UNSET   # 'consider it case by case': NOT converted into 45, 60 or any number
  hard_limit_policy: CASE_BY_CASE
  airport_importance: IRRELEVANT              # INPUT PASS 3: not relevant to this home-location decision; do not evaluate or score airport access
  shopping_daily_services_importance: UNSET  # INTENTIONAL: town services (35 min, STRONG_PREFERENCE) is accepted as sufficient; no separate daily-essentials threshold

livability:   # placeholders for later livability modelling; not evaluated in M2B.0
  preferred_population_density: UNSET        # REMOTE | RURAL | PERI_URBAN | SUBURBAN | URBAN
  avoid_dense_urban_core: true
  avoid_dense_urban_core_importance: STRONG_PREFERENCE
  # stated preference: a peaceful / lower-density setting even if normal town access is about 30-35 minutes
  # INPUT PASS 3: avoidance PREFERENCES for residential exposure. Not hard exclusions; no buffer distance or proximity threshold was given (all UNSET).
  # Future evidence must be context-aware (active/inactive, type, scale, noise, dust, truck traffic); a mapped feature is not automatically a nuisance.
  avoid_industrial_nuisance:         # factories / industrial facilities
    value: true
    importance: STRONG_PREFERENCE
    buffer_distance_m: UNSET
  avoid_mining_quarry_nuisance:      # mines, quarries, stone crushing
    value: true
    importance: STRONG_PREFERENCE
    buffer_distance_m: UNSET
  avoid_major_road_noise:            # RESIDENTIAL EXPOSURE to noisy major roads. NOT the same as access to a major road (road_access.major_road)
    value: true
    importance: STRONG_PREFERENCE
    buffer_distance_m: UNSET
  avoid_nightlife_concentration:     # residential nuisance from concentrated nightlife, NOT restaurants or normal town services; no generic POI-density penalty
    value: true
    importance: STRONG_PREFERENCE
    buffer_distance_m: UNSET
  tolerate_tourism_activity: UNSET           # NONE | LOW | MODERATE | HIGH
  tolerate_nightlife: UNSET
  industrial_nuisance_tolerance: UNSET
  agricultural_surroundings_preference: UNSET

land:         # will later interact with parcel screening
  land_purchase_budget:      # INPUT PASS 2: the price of BARE LAND only. It says nothing about house-construction cost.
    preferred_thb: UNSET     # not yet decided; no preferred budget below the ceiling is invented
    absolute_max_thb: 500000 # bare land should not cost more than THB 500,000
    importance: MUST
  house_construction_budget_thb: UNSET   # not stated; deliberately separate from the land price
  preferred_area_rai: UNSET  # parcel size is not fixed yet; usable area must later be considered separately from nominal area
  minimum_area_rai: UNSET
  maximum_area_rai: UNSET
  terrain_preference: GENTLE_ROLLING   # INPUT PASS 3: gentle / rolling terrain with some elevation variation rather than completely flat; FLAT | GENTLE_ROLLING | HILLY
  terrain_preference_importance: PREFERENCE   # no slope-degree range is given or inferred; NOT 'steep is acceptable' and NOT 'any slope is acceptable'
  terrain_tolerance: UNSET   # NOT inferred from the willingness to improve a site or from the terrain preference
  # Site-improvement tolerance (INPUT PASS 2): willing, with NO project-level limit and NO financial allowance stated yet.
  # true means "permissive / unrestricted so far". It never overrides a hazard action (see hazard_contract).
  willingness_to_improve_drainage: true
  willingness_to_build_retaining_structures: true
  willingness_to_grade_or_fill: true
