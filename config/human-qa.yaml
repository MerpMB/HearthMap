      - major settlement patterns align plausibly with known northern Thailand urban and valley geography
      - no obvious CRS displacement or raster/geometry shift
      - unresolved routing is concentrated in sparse, mountainous, low-built-up terrain
      - canonical edge-origin corrections appear along the outer AOI boundary, not as internal province seams
      - no artificial discontinuity along internal Chiang Mai / Chiang Rai / Phayao boundaries
      - population and built-form evidence remain visually distinct
      - administrative-resolution DIW/DPIM evidence is shown as context, not exact facility location
      - town-service definition sensitivity remains visible and unresolved
      - evidence gaps are shown as gaps, not positive evidence
    known_non_blocking_limitations_not_resolved:
      - destination catalogues are boundary limited
      - current education truth is stale/partial
      - CORE vs BROADER town-service semantics are not selected
      - DIW and DPIM lack exact facility geometry for some evidence
      - OSM completeness varies
      - dense-urban-core thresholds are not calibrated
      - land-market evidence has not been acquired
      - fiber/electricity/legal-access parcel truth remains later-stage verification
    family_scoring: FAMILY_SCORING_ALLOWED remains false
