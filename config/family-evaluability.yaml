# M2C evaluability plan (planning artifact; NO geographic scoring).
#
# For each calibrated requirement family: what evidence exists, at what resolution/freshness/completeness, whether it is
# SAFE to evaluate with, and in which decision stage it may responsibly be used. These are SEPARATE judgements and are never
# collapsed into one confidence field. Priorities are DERIVED by code from importance + the factors below (see
# hearthmap.family.evaluability.derive_priority); they are never typed in and never depend on how easy a dataset is to obtain.
#
# Stages: REGIONAL_SCREENING | CANDIDATE_ZONE_COMPARISON | PARCEL_SHORTLIST | PRE_PURCHASE_VERIFICATION
# States: READY | READY_WITH_LIMITATIONS | PROXY_ONLY | PARTIAL | NOT_EVALUABLE | PARCEL_VERIFICATION_ONLY |
#         FIELD_VERIFICATION_ONLY | BLOCKED_BY_SOURCE_GAP | INTENTIONALLY_NOT_USED
# A column existing in an artifact never makes a requirement READY.
schema_version: 1
version: "0.1.0"
status: PLAN_ONLY_NO_EVALUATION_ACTIVE

scoring_gate:
  FAMILY_SCORING_ALLOWED: false          # M2C does not turn scoring on, and the loader refuses a true value
  criteria:
    - "Every MUST/STRONG_PREFERENCE requirement is either evaluable at a regional/candidate stage (READY, READY_WITH_LIMITATIONS or explicit PROXY_ONLY) or has been moved to an explicit later-stage verification state."
    - "Evidence that decides the regional search space (P0 families) is at least READY_WITH_LIMITATIONS, or an explicitly labelled PROXY_ONLY with documented semantics approved by the owner."
    - "No unsupported MUST requirement is silently ignored: it appears in the permission matrix with a verification stage."
    - "No unresolved or missing evidence is interpreted as positive evidence."
    - "Proxy evidence is never presented as verified, and parcel/field requirements are never satisfied by regional evidence."
    - "User requirements (config/family-requirements.yaml) are unchanged by evidence gaps; IRRELEVANT dimensions stay excluded."
    - "M1E hazard actions remain independent and immutable; family access, terrain preference and site-improvement willingness never offset them."
    - "The owner has reviewed the interpretation of each evaluable requirement (including the numeric meaning of any preference) and explicitly authorised scoring."

hazard_contract: M1E hazard actions are immutable and independent of every family requirement and every evidence state below.

entries:
  # ------------------------------------------------------------------------------------------------ education
  - id: EDU-KG
    title: Kindergarten travel time
    requirement_paths: [education.kindergarten]
    importance_path: education.kindergarten.importance
    evidence_families: [EF-01]
    evidence: {exists: PARTIAL, resolution: "500 m cell, baseline drive time to facility points", freshness: STALE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "register is DOPA 2021 + OBEC 2020 classes (about half of schools authoritative); the MOE current register is not accessible Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [PARTIAL, "drive times exist but facility freshness and classification are partial"]
      CANDIDATE_ZONE_COMPARISON: [PARTIAL, "show nearest kindergartens with source vintage and classification basis"]
      PARCEL_SHORTLIST: [PARTIAL, "re-measure from the parcel entrance with current facilities"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the facility is open and enrolling"]
    allowed_use: "regional context and candidate comparison with freshness shown; a time above the preferred band is information, not a rejection"
    forbidden_use: "presenting travel time as school quality; treating a stale facility as currently open; rejecting a site on stale data alone"
    next_evidence_needed: "current institution register (MOE central register or a federated current register), current-school presence verification, classification freshness, coordinate confidence"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: MEDIUM, false_positive_cost: MEDIUM, false_negative_cost: MEDIUM}
    why: "Education travel times shape which regions are searched; the register is stale, so the evidence gap matters at the first stage."
  - id: EDU-PRIMARY
    title: Primary school travel time
    requirement_paths: [education.primary]
    importance_path: education.primary.importance
    evidence_families: [EF-01]
    evidence: {exists: PARTIAL, resolution: "500 m cell, baseline drive time to facility points", freshness: STALE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "unstated school levels default to primary at LOW confidence; register stale Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [PARTIAL, "usable for context only until a current register exists"]
      CANDIDATE_ZONE_COMPARISON: [PARTIAL, "compare with freshness and basis shown"]
      PARCEL_SHORTLIST: [PARTIAL, "re-measure from the parcel entrance"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm a currently operating primary school and its catchment/enrolment rules"]
    allowed_use: "regional context and candidate comparison with freshness shown; a MUST that cannot yet be evaluated is carried as verify-before-purchase, never passed"
    forbidden_use: "treating missing or stale school evidence as a pass; school quality claims; hiding that levels are partly derived"
    next_evidence_needed: "current institution register with authoritative levels, status and coordinates"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: MEDIUM, false_positive_cost: HIGH, false_negative_cost: MEDIUM}
    why: "A MUST whose travel time shapes the search space, resting on a stale register."
  - id: EDU-LOWSEC
    title: Lower secondary travel time
    requirement_paths: [education.lower_secondary]
    importance_path: education.lower_secondary.importance
    evidence_families: [EF-01]
    evidence: {exists: PARTIAL, resolution: "500 m cell; lower and upper secondary are pooled in the artifact", freshness: STALE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "authoritative OBEC class ranges separate lower from upper secondary for about half of schools; the artifact does not yet Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [PARTIAL, "pooled secondary evidence only"]
      CANDIDATE_ZONE_COMPARISON: [PARTIAL, "separate lower secondary using authoritative class ranges where available"]
      PARCEL_SHORTLIST: [PARTIAL, "re-measure with current facilities"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the school offers lower secondary"]
    allowed_use: "regional context with the pooled-secondary limitation shown"
    forbidden_use: "treating pooled secondary time as lower-secondary truth; treating missing evidence as a pass"
    next_evidence_needed: "current register with level fields; rebuild with lower and upper secondary separated"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: MEDIUM, false_positive_cost: HIGH, false_negative_cost: MEDIUM}
    why: "A MUST on a stage the current artifact cannot separate, on a stale register."
  - id: EDU-UPSEC
    title: Upper secondary travel time
    requirement_paths: [education.upper_secondary]
    importance_path: education.upper_secondary.importance
    evidence_families: [EF-01]
    evidence: {exists: PARTIAL, resolution: "500 m cell; pooled with lower secondary", freshness: STALE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "same pooled, stale evidence as lower secondary Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [PARTIAL, "pooled secondary evidence only"]
      CANDIDATE_ZONE_COMPARISON: [PARTIAL, "separate with authoritative class ranges where available"]
      PARCEL_SHORTLIST: [PARTIAL, "re-measure with current facilities"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the school offers upper secondary"]
    allowed_use: "regional context with the pooled-secondary limitation shown"
    forbidden_use: "treating pooled time as upper-secondary truth; treating missing evidence as a pass"
    next_evidence_needed: "as EDU-LOWSEC"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: MEDIUM, false_positive_cost: MEDIUM, false_negative_cost: MEDIUM}
    why: "A strong preference on the same stale, pooled evidence."
  - id: ALT-CHOICES
    title: Education and healthcare alternatives (decision context)
    requirement_paths: [redundancy, education.kindergarten.minimum_choices, education.primary.minimum_choices, education.lower_secondary.minimum_choices, education.upper_secondary.minimum_choices]
    importance_path: redundancy.number_of_primary_schools_within_time.importance
    evidence_families: [EF-16, EF-01, EF-02]
    gate: false
    use_as: DECISION_CONTEXT
    evidence: {exists: YES, resolution: "500 m cell; counts within 15/30/60 minutes", freshness: STALE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "counts exist for the configured bands only; education facilities are stale"}
    stages:
      REGIONAL_SCREENING: [INTENTIONALLY_NOT_USED, "no minimum number of schools was requested: not a gate"]
      CANDIDATE_ZONE_COMPARISON: [PARTIAL, "show the nearest N facilities with travel time, type, classification and source freshness"]
      PARCEL_SHORTLIST: [PARTIAL, "show alternatives from the parcel entrance"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the alternatives actually exist and are open"]
    allowed_use: "multiple reachable alternatives displayed side by side as decision context"
    forbidden_use: "any minimum-choice gate or score; penalising a location because only one institution meets the preferred band"
    next_evidence_needed: "arbitrary-time counts (not only 15/30/60); current registers"
    verification_stage: PRE_PURCHASE_VERIFICATION
    intentionally_not_used_reason: "the owner wants alternatives shown for comparison, not a fixed minimum number of schools"
    priority_factors: {earliest_decision_stage: CANDIDATE_ZONE_COMPARISON, changes_regional_search_space: false, evidence_gap: NONE, regional_evidence_feasible: true, feasibility: HIGH, false_positive_cost: LOW, false_negative_cost: LOW}
    why: "Context output, not a requirement with a threshold."
  # ------------------------------------------------------------------------------------------------ healthcare
  - id: HC-PRIMARY
    title: Primary healthcare travel time
    requirement_paths: [healthcare.primary_healthcare]
    importance_path: healthcare.primary_healthcare.importance
    evidence_families: [EF-02]
    evidence: {exists: YES, resolution: "500 m cell, baseline drive time to MoPH facility points", freshness: ACCEPTABLE, completeness: PARTIAL, safety: SAFE, safety_reason: "current MoPH layer (2026 edit, mostly 2023-dated records); government facilities only; a preference, not a gate Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [READY_WITH_LIMITATIONS, "context with the government-only limitation shown"]
      CANDIDATE_ZONE_COMPARISON: [READY_WITH_LIMITATIONS, "nearest facilities with type and record date"]
      PARCEL_SHORTLIST: [READY_WITH_LIMITATIONS, "re-measure from the parcel entrance"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the unit is open and serves the area"]
    allowed_use: "regional context and comparison; a longer time lowers a preference, never rejects"
    forbidden_use: "treating a primary-care unit as emergency capability; treating the preference as a hard gate"
    next_evidence_needed: "HCODE export or newer MoPH records for status and dates; private clinics are out of scope"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: CANDIDATE_ZONE_COMPARISON, changes_regional_search_space: false, evidence_gap: NONE, regional_evidence_feasible: true, feasibility: HIGH, false_positive_cost: LOW, false_negative_cost: LOW}
    why: "Current evidence is adequate for a preference."
  - id: HC-HOSPITAL
    title: Hospital travel time
    requirement_paths: [healthcare.hospital]
    importance_path: healthcare.hospital.importance
    evidence_families: [EF-02]
    evidence: {exists: YES, resolution: "500 m cell, baseline drive time to MoPH hospital points", freshness: ACCEPTABLE, completeness: PARTIAL, safety: SAFE, safety_reason: "source-stated hospital types; government hospitals only; type is not capability Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [READY_WITH_LIMITATIONS, "usable for the MUST with the limitations shown; cells with no road access stay unresolved"]
      CANDIDATE_ZONE_COMPARISON: [READY_WITH_LIMITATIONS, "nearest hospitals with type and record date"]
      PARCEL_SHORTLIST: [READY_WITH_LIMITATIONS, "re-measure from the parcel entrance"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm the hospital operates and the route"]
    allowed_use: "evaluation against the stated limits with unresolved cells reported as unresolved, never as passing"
    forbidden_use: "inferring emergency, trauma, ICU or specialist capability from the word hospital or from its class; treating an unrouted cell as within the limit"
    next_evidence_needed: "none blocking; HCODE export or newer MoPH records would improve dates and status"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: NONE, regional_evidence_feasible: true, feasibility: HIGH, false_positive_cost: MEDIUM, false_negative_cost: MEDIUM}
    why: "Evidence is adequate with limitations; no acquisition is needed to evaluate it."
  - id: HC-REGIONAL
    title: Regional / referral hospital travel time
    requirement_paths: [healthcare.regional_or_referral_hospital]
    importance_path: healthcare.regional_or_referral_hospital.importance
    evidence_families: [EF-02]
    evidence: {exists: YES, resolution: "500 m cell, drive time to the two hospitals the source types as regional", freshness: ACCEPTABLE, completeness: PARTIAL, safety: SAFE, safety_reason: "source typecode only; large general and university hospitals are not promoted; no capability stated Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [READY_WITH_LIMITATIONS, "two regional hospitals; cells beyond the 120 minute search limit stay unresolved"]
      CANDIDATE_ZONE_COMPARISON: [READY_WITH_LIMITATIONS, "show the regional hospital reached and its type"]
      PARCEL_SHORTLIST: [READY_WITH_LIMITATIONS, "re-measure from the parcel entrance"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "confirm what services the referral hospital actually provides"]
    allowed_use: "evaluation of the stated window with limitations shown"
    forbidden_use: "treating a regional class as emergency/trauma/ICU capability"
    next_evidence_needed: "none blocking; an authoritative service-level/capability source if the owner later wants capability requirements"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: NONE, regional_evidence_feasible: true, feasibility: HIGH, false_positive_cost: LOW, false_negative_cost: LOW}
    why: "Evidence is adequate with limitations."
  - id: HC-CAPABILITY
    title: Emergency / trauma / ICU capability (future verification path)
    requirement_paths: []
    importance_path: null
    evidence_families: [EF-02]
    evidence: {exists: "NO", resolution: "none", freshness: NONE, completeness: NONE, safety: NOT_SAFE_REGIONALLY, safety_reason: "no accessible source states capability; no requirement has been set"}
    stages:
      REGIONAL_SCREENING: [NOT_EVALUABLE, "no capability evidence"]
      CANDIDATE_ZONE_COMPARISON: [NOT_EVALUABLE, "no capability evidence"]
      PARCEL_SHORTLIST: [NOT_EVALUABLE, "no capability evidence"]
      PRE_PURCHASE_VERIFICATION: [FIELD_VERIFICATION_ONLY, "ask the specific hospital what it provides"]
    allowed_use: "a future facility-verification checklist only"
    forbidden_use: "inferring capability from facility class, bed count or name"
    next_evidence_needed: "owner-defined capability requirements, then facility-level verification"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: PRE_PURCHASE_VERIFICATION, changes_regional_search_space: false, evidence_gap: EVIDENCE, regional_evidence_feasible: false, feasibility: LOW, false_positive_cost: HIGH, false_negative_cost: LOW}
    why: "No requirement has been stated; recorded so the question is not silently assumed answered."
  # ------------------------------------------------------------------------------------------------ town services
  - id: TOWN-SERVICES
    title: Town-services access (preferred 35 min)
    requirement_paths: [urban_access.preferred_drive_time_to_town_services, urban_access.hard_limit_policy]
    importance_path: urban_access.preferred_drive_time_to_town_services_importance
    evidence_families: [EF-03]
    evidence: {exists: "YES", resolution: "500 m cell, baseline drive time to OSM service POIs by component (M2D)", freshness: ACCEPTABLE, completeness: PARTIAL, safety: PARTIAL, safety_reason: "component accessibility only: the town-services bundle is NOT YET DEFINED, CORE and BROADER clusters are candidate definitions, OSM completeness varies, and about 43% of cells have no road within 1 km (unresolved, not zero) Destination-boundary limit: the destination catalogue covers only the three AOI provinces (BOUNDARY_LIMITED), so edge-cell travel times may overstate access to neighbouring-province destinations; no destination was invented and no international destination is modelled."}
    stages:
      REGIONAL_SCREENING: [READY_WITH_LIMITATIONS, "READY WITH LIMITATIONS FOR COMPONENT ACCESSIBILITY ONLY (per-component baseline drive time, routable cells only); the requirement-level town-services bundle is not yet defined"]
      CANDIDATE_ZONE_COMPARISON: [READY_WITH_LIMITATIONS, "component accessibility only, with unresolved cells shown; CORE and BROADER cluster definitions stay candidate definitions and neither is selected"]
      PARCEL_SHORTLIST: [NOT_EVALUABLE, "re-measure once defined"]
      PRE_PURCHASE_VERIFICATION: [FIELD_VERIFICATION_ONLY, "drive the route to the actual services"]
    allowed_use: "descriptive per-component drive times and counts; no weighted service score and no threshold activation (the hard limit is case by case, no number is derived)"
    forbidden_use: "converting 'case by case' into a threshold; using hospital or university access as town services; treating missing evidence as within 35 minutes"
    next_evidence_needed: "operational definition of the town-services bundle (owner approval), authoritative and OSM facility sources with freshness, routing from cell centres"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: MEDIUM, false_positive_cost: MEDIUM, false_negative_cost: HIGH}
    why: "A strong preference with no evidence at all that decides how far from towns the search can go."
  # ------------------------------------------------------------------------------------------------ land price
  - id: LAND-PRICE
    title: Bare-land purchase price ceiling (THB 500,000)
    requirement_paths: [land.land_purchase_budget]
    importance_path: land.land_purchase_budget.importance
    evidence_families: [EF-04]
    evidence: {exists: "NO", resolution: "none", freshness: NONE, completeness: NONE, safety: NOT_SAFE_REGIONALLY, safety_reason: "no land-price evidence; an asking price is not a market value; a parcel price is meaningless without its area"}
    stages:
      REGIONAL_SCREENING: [BLOCKED_BY_SOURCE_GAP, "price levels by area could only ever be indicative"]
      CANDIDATE_ZONE_COMPARISON: [PROXY_ONLY, "at best appraised-value or listing-price proxies by zone, normalised by area and labelled proxy"]
      PARCEL_SHORTLIST: [PARCEL_VERIFICATION_ONLY, "actual asking price with area, status and duplicates checked"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "negotiated/transaction price against the ceiling"]
    proxy_semantics: "appraised value or asking price per unit area is an indication of price level, not the purchase price of any parcel"
    allowed_use: "labelled proxy price levels by zone once acquired; shortlist parcels carry their verified price"
    forbidden_use: "treating an asking price as market value; comparing parcel totals without area; presenting a proxy as verified; treating missing price evidence as affordable"
    next_evidence_needed: "government appraised values, transaction/reference prices, listing asking prices with stale and duplicate detection and geocoding uncertainty"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: REGIONAL_SCREENING, changes_regional_search_space: true, evidence_gap: EVIDENCE, regional_evidence_feasible: true, feasibility: LOW, false_positive_cost: HIGH, false_negative_cost: HIGH}
    why: "A MUST that can remove large parts of the search space and has no evidence yet. M2D deferred acquisition only: the Treasury D-Value appraisal is recorded as OFFICIAL_APPRAISAL_CONTEXT research, not acquired, and the P0 gap is unchanged."
  # ------------------------------------------------------------------------------------------------ electricity
  - id: ELEC-GRID
    title: Grid electricity at the parcel (before purchase)
    requirement_paths: [utilities.electricity]
    importance_path: utilities.electricity.importance
    evidence_families: [EF-05]
    parcel_only: true
    evidence: {exists: "NO", resolution: "none (PEA Power Map has no verified machine-readable source)", freshness: NONE, completeness: NONE, safety: NOT_SAFE_REGIONALLY, safety_reason: "regional service context is not parcel connection truth; nearby poles do not prove a connection"}
    stages:
      REGIONAL_SCREENING: [NOT_EVALUABLE, "regional service context may be added later as context only"]
      CANDIDATE_ZONE_COMPARISON: [PROXY_ONLY, "at best settlement/electrification context, labelled proxy; no source yet"]
      PARCEL_SHORTLIST: [PARCEL_VERIFICATION_ONLY, "ask PEA whether the parcel can be connected"]
      PRE_PURCHASE_VERIFICATION: [PARCEL_VERIFICATION_ONLY, "written/confirmed connection availability before purchase"]
    proxy_semantics: "settlement or distribution-infrastructure context suggests where service is likely, not that a parcel can connect"
    allowed_use: "context only; missing evidence triggers verification, never rejection or acceptance"
    forbidden_use: "inferring connection availability from nearby poles; turning PEA planning maps into parcel truth; inferring capacity, transformer, phase, cost or reliability"
    next_evidence_needed: "PEA service-context source if one becomes accessible; a parcel-level confirmation procedure with PEA"
    verification_stage: PRE_PURCHASE_VERIFICATION
    priority_factors: {earliest_decision_stage: PARCEL_SHORTLIST, changes_regional_search_space: false, evidence_gap: EVIDENCE, regional_evidence_feasible: false, feasibility: LOW, false_positive_cost: HIGH, false_negative_cost: LOW}
    why: "A MUST whose truth exists only at the parcel; regional evidence cannot decide it."
