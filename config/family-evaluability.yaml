    evidence: {exists: "NO", resolution: "none (no PWA service-area polygons are published)", freshness: NONE, completeness: NONE, safety: NOT_SAFE_REGIONALLY, safety_reason: "PWA is not required; outside PWA is not 'no water' and not 'acceptable water'"}
