# Hydrogeomorphic Hazard Screening policy v0.1 (M1C).
#
# STATUS: PROVISIONAL. Regional screening outcomes only - never SAFE, BUILDABLE,
# FINAL_REJECT or LEGAL_EXCLUSION. No profile is the default while the human
# visual gates are pending. Semantics: docs/product/hazard-screening-policy.md
schema_version: 1
policy_id: hydrogeomorphic-screening
policy_version: 0.2.0   # 0.2.0 (M1C.1): flood thresholds re-based on GISTDA 2011-2023
status: PROVISIONAL
scope: HYDROGEOMORPHIC   # flood (observed), landslide susceptibility, DSM terrain
default_profile: null    # stays null until a profile is explicitly selected by the family

gates:
  # Mirrors config/human-qa.yaml (project user, 2026-10-15: no blocking visual anomalies).
  m1a1_human_visual_signoff: PASSED
  m1b_human_visual_signoff: PASSED

source_requirements:
  flood:
    # Every flood threshold below refers to THIS record (checked against the
    # evidence columns flood_source_id / flood_evidence_period / flood_record_years).
    source_id: flood-gistda-history
    evidence_role: PRIMARY_HISTORICAL_FLOOD_EVIDENCE
    period: "2011-2023"
    record_years: 13
    source_native_metric: "total = number of years 2011-2023 observed flooded (sum of yearly detail.freq, each 0/1)"
    derived_threshold_semantics: "flood_years_ge{min_years_flooded}_area_fraction = share of the cell observed flooded in >= min_years_flooded of the 13 years; *_min_fraction thresholds apply to that share"
    contemporary_complete: false        # ends 2023; no flood policy may claim current completeness
    corroborating_source:
      source_id: flood-gistda-repeated-2005-2016
      role: HISTORICAL_CORROBORATION
      period: "2005-2016"
      use: context only (legacy_flood_2005_2016_* columns); never read by the policy
  landslide_susceptibility:
    source_id: landslide-susceptibility-dmr
    evidence_role: SUSCEPTIBILITY        # not a probability of failure
    methodology_published: false
  landslide_inventory:
    source_id: landslide-inventory-dmr
    use: CORROBORATING_POSITIVE_ONLY     # absence never lowers concern
  terrain:
    source_id: dem-copernicus-glo30
    surface_model: DSM                   # not bare-earth ground slope
    may_deprioritize_alone: false

dependencies:
  # The DMR methodology is unpublished: it may already use slope. Terrain is
  # therefore NOT treated as statistically independent; no probabilities are
  # combined. Corroboration is categorical and labelled with this dependency.
  dmr_susceptibility_uses_terrain: UNKNOWN

# Columns the policy may never read (context only, or review artifacts).
prohibited_evidence_columns:
  - reserve_area_fraction
  - park_area_fraction
  - sanctuary_area_fraction
  - requires_legal_verification
  - boundary_attribution_uncertain
  - boundary_zone_ids
  - dist_major_waterway_m
  - dist_any_waterway_m
  - waterway_river_length_m
  - waterway_canal_length_m
  - waterway_stream_length_m
  - legacy_flood_2005_2016_area_fraction
  - legacy_flood_2005_2016_years_ge3_area_fraction
prohibited_source_prefixes: ["review:", "experimental:", "policy:"]

unresolved:
  landslide_min_assessed_fraction: 0.5   # below: landslide not evaluated for policy
  landslide_critical_assessed_fraction: 0.05   # below: UNRESOLVED_CRITICAL (essentially no coverage)
  terrain_min_support_px: 1.0
  terrain_low_support_px: 10.0

profiles:
  CONSERVATIVE:
    flood:
      min_years_flooded: 3            # of 13 years (2011-2023)
      strong_min_fraction: 0.05
      deprioritize_min_fraction: 0.25
      verify_min_fraction: 0.01
      verify_distance_m: 500
    landslide:
      very_high_strong: 0.10
      very_high_deprioritize: 0.25
      high_plus_strong: 0.25
      high_plus_deprioritize: 0.50
      verify_high_plus: 0.01
      verify_medium_plus: 0.25
      scar_within_m: 500
      scar_escalates_strong: true      # scar + STRONG susceptibility -> DEPRIORITIZE
    terrain:
      verify_slope_p90_deg: 25
      corroborate_slope_p90_deg: 30
      corroboration_escalates_landslide: true
    multi_hazard:
      escalate_flood_and_landslide_strong: true
  BALANCED:
    flood:
      min_years_flooded: 3            # of 13 years (2011-2023)
      strong_min_fraction: 0.10
      deprioritize_min_fraction: 0.50
      verify_min_fraction: 0.01
      verify_distance_m: 250
    landslide:
      very_high_strong: 0.25
      very_high_deprioritize: 0.50
      high_plus_strong: 0.50
      high_plus_deprioritize: 0.75
      verify_high_plus: 0.01
      verify_medium_plus: 0.50
      scar_within_m: 0
      scar_escalates_strong: false
    terrain:
      verify_slope_p90_deg: 30
      corroborate_slope_p90_deg: 35
      corroboration_escalates_landslide: false
    multi_hazard:
      escalate_flood_and_landslide_strong: true
  PERMISSIVE:
    flood:
      min_years_flooded: 3            # of 13 years (2011-2023)
      strong_min_fraction: 0.25
      deprioritize_min_fraction: 0.75
      verify_min_fraction: 0.05
      verify_distance_m: 0
    landslide:
      very_high_strong: 0.50
      very_high_deprioritize: 0.75
      high_plus_strong: 0.75
      high_plus_deprioritize: 0.95
      verify_high_plus: 0.10
      verify_medium_plus: 0.75
      scar_within_m: 0
      scar_escalates_strong: false
    terrain:
      verify_slope_p90_deg: 35
      corroborate_slope_p90_deg: 40
      corroboration_escalates_landslide: false
    multi_hazard:
      escalate_flood_and_landslide_strong: false

# Reason codes -> explanation templates (filled from structured cell values).
reason_codes:
  RECURRENT_FLOOD_SUBSTANTIAL_COVERAGE: "Observed flooding in >= {flood_years} of {flood_record_years} years ({flood_period}) covers {flood_recurrent_fraction:.0%} of the cell"
  STRONG_RECURRENT_FLOOD_EVIDENCE: "Observed flooding in >= {flood_years} of {flood_record_years} years ({flood_period}) covers {flood_recurrent_fraction:.0%} of the cell"
  OBSERVED_FLOOD_EVIDENCE: "Some observed flooding in or near the cell in {flood_period} ({flood_area_fraction:.0%} of cell)"
  VERY_HIGH_LANDSLIDE_SUSCEPTIBILITY_DOMINANT: "DMR 'Very High' susceptibility covers {landslide_class5_fraction:.0%} of the cell"
  HIGH_VERY_HIGH_SUSCEPTIBILITY_DOMINANT: "DMR 'High'+'Very High' susceptibility covers {landslide_high_plus_fraction:.0%} of the cell"
  STRONG_LANDSLIDE_SUSCEPTIBILITY_EVIDENCE: "DMR 'Very High' {landslide_class5_fraction:.0%} / 'High'+'Very High' {landslide_high_plus_fraction:.0%} of the cell"
  LANDSLIDE_SUSCEPTIBILITY_BELOW_DEPRIORITIZATION: "Some DMR 'High'/'Very High' or extensive 'Medium' susceptibility ({landslide_medium_plus_fraction:.0%} Medium+)"
  HISTORICAL_LANDSLIDE_SCAR_NEARBY: "Mapped historical landslide scar(s) in or near the cell ({landslide_inventory_points} in cell; nearest {landslide_inventory_distance_m:.0f} m)"
  SCAR_CORROBORATES_LANDSLIDE_SUSCEPTIBILITY: "Mapped scar corroborates the susceptibility concern (inventory coverage is uneven)"
  TERRAIN_STEEPNESS_PROXY_HIGH: "DSM slope p90 {slope_p90_deg:.0f} deg (steepness proxy; DSM, not ground slope)"
  LANDSLIDE_TERRAIN_CORROBORATED: "DSM steepness (p90 {slope_p90_deg:.0f} deg) supports the landslide concern; dependency on DMR inputs UNKNOWN"
  MULTIPLE_STRONG_HAZARD_SIGNALS: "Strong evidence from both flood and landslide susceptibility"
  LANDSLIDE_NOT_ASSESSED: "DMR susceptibility covers only {landslide_assessed_fraction:.0%} of the cell"
  TERRAIN_SUPPORT_INSUFFICIENT: "Terrain support {terrain_support_px:.1f} pixel-equivalents (< 1)"
  LOW_TERRAIN_SUPPORT: "Terrain statistics rest on only {terrain_support_px:.1f} pixel-equivalents"
  PARTIAL_LANDSLIDE_COVERAGE: "DMR susceptibility covers {landslide_assessed_fraction:.0%} of the cell (partial)"
  NO_OBSERVED_FLOOD_IN_RECORD: "No observed flooding in the {flood_period} record (not evidence of no flood risk)"
