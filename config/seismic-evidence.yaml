# Seismic evidence model v0.2 (M1D) - evidence engineering for REGIONAL screening.
#
# STATUS: PROVISIONAL and EXPERIMENTAL. No final seismic policy is selected
# (default_policy must stay null). Thresholds are provisional starting points; sensitivity
# across them is reported (outputs/m1d-review/seismic-sensitivity.csv) and none was chosen to
# reach a convenient share of the AOI.
#
# Four concepts are kept apart and never collapsed into one number:
#   FAULT_CONTEXT, EARTHQUAKE_HAZARD (DMR probabilistic PGA hazard displayed as MMI zones),
#   HISTORICAL_SEISMICITY, GROUND_RESPONSE (not assessed - an explicit limitation).
# Fault proximity, hazard zones and event catalogues are NOT independent observations (the
# DMR hazard analysis may itself draw on fault/seismicity information); agreement between
# them is "corroborating evidence", never independent confirmation, and nothing is multiplied.
# Distance to a fault trace is context, not a risk score. Absence of a nearby fault or event
# never lowers concern and never means "earthquake safe". Terrain/lowland strata and the
# hydrogeomorphic results are never inputs. This is regional screening, not a parcel/site
# seismic assessment.
schema_version: 1
seismic_id: seismic-evidence
seismic_version: 0.2.0   # 0.2.0: EQ_ZONE basis corrected; history can no longer be required for STRONG
status: PROVISIONAL
experimental: true
default_policy: null

reporting_radii_km: [5, 10, 20, 50]
history_magnitude_thresholds: [4.0, 5.0, 6.0]

sources:
  faults:
    source_id: seismic-active-faults-dmr
    role: FAULT_CONTEXT
  intensity_zones:
    source_id: seismic-intensity-zones-dmr
    role: EARTHQUAKE_HAZARD
    class_field: INTENSITY
    classes: ["I-III", "IV", "V", "VI", "VII"]   # publisher MMI classes, never renumbered
    # Publisher wording (data.dmr.go.th catalogue record eq_zone, `data_source`), faithfully:
    #   "การวิเคราะห์ความน่าจะเป็นของค่าความเร่งพื้นดินสูงสุดของแผ่นดินไหวที่มีโอกาสเพียง 10% ที่มีค่า
    #    สูงกว่าค่าที่วิเคราะห์ได้ในคาบเวลา 50 ปี ตามสมการของ Sadigh and others (1997)
    #    ในโครงการการประเมินภัยพิบัติแผ่นดินไหว"
    # = probabilistic analysis of peak ground acceleration (PGA) with a 10% probability of
    #   exceedance in 50 years, per Sadigh et al. (1997), in the earthquake-hazard assessment
    #   project. The published GIS layer shows the result as Modified Mercalli intensity zones
    #   (I-III..VII); the PGA -> MMI transformation is NOT documented and is not inferred.
    basis:
      kind: PROBABILISTIC_PGA_HAZARD_DISPLAYED_AS_MMI_ZONES
      exceedance_probability: 0.10
      exposure_period_years: 50
      ground_motion_relation: "Sadigh and others (1997)"
      project: "earthquake-hazard assessment project (โครงการการประเมินภัยพิบัติแผ่นดินไหว)"
      displayed_classes: "MMI I-III, IV, V, VI, VII"
      pga_to_mmi_mapping_documented: false
      map_scale_documented: false
      vintage: "catalogue metadata created 2023-06-19, modified 2026-08-13; earlier data.go.th record 2020-07-18; data year not stated"
      remaining_unknowns:
        - PGA to MMI class transformation and class boundaries
        - site conditions assumed (rock/soil) and Vs30 treatment
        - source-model inputs (which faults/seismicity were used)
        - map scale / spatial resolution
        - magnitude/distance relation validity for local conditions
  history:
    - {source_id: geohazard-events-dmr, kind: DMR_EARTHQUAKE_INVENTORY}
    - {source_id: seismic-felt-events-tmd, kind: TMD_FELT_EVENTS}
    - {source_id: seismicity-usgs-comcat, kind: USGS_COMPOSITE_INTERNATIONAL_CATALOGUE}
  validation:
    - {source_id: seismic-tambon-near-faults-dmr, kind: DMR_TAMBON_WITHIN_20KM_LISTING}

# Experimental regional interpretation.
#  * modelled hazard (EQ_ZONE): the top published MMI class (VII) covering >= strong_min_fraction
#    of the cell may on its own give STRONG_SEISMIC_SCREENING_CONCERN. 0.5 = "dominant" (a
#    majority rule that follows from the class semantics, not from a target percentage);
#    verify_min_fraction 0.10 = a substantial share. Borderline cells (between the two) are
#    escalated only by positive corroboration.
#  * fault proximity: alone at most REQUIRES_SEISMIC_VERIFICATION (no documented methodology
#    links trace distance to shaking). "Very near" is a corroborating signal.
#  * historical events: nearby events add reason codes, may raise verification and corroborate;
#    they are never required for a modelled-hazard result and their absence changes nothing.
interpretation:
  fault_alone_max_level: VERIFY
  history_alone_max_level: VERIFY
  fault:
    verify_within_km: 10
    very_near_within_km: 5
  shaking:
    class_name: VII
    verify_min_fraction: 0.10
    strong_min_fraction: 0.50
    min_assessed_fraction: 0.5      # below: zone context is not assessed for the cell
    escalate_borderline_with_corroborating_signals: 2   # fault very near AND an event corroborates
  history:
    magnitude: 5.0                  # column hist_nearest_ge{magnitude}_km (any source)
    verify_within_km: 50
    corroborate_within_km: 25

# Family-level confidence, kept as separate dimensions (never one number).
confidence:
  fault_context:
    source: MEDIUM             # official DMR dataset (CC Attribution); 16-group map, 2012 vintage
    methodology: LOW           # compiled from imagery/geology/geomorphology/events + field checks; details unpublished
    spatial_completeness: MEDIUM   # national traces; unmapped/buried faults unknown
    temporal_completeness: NOT_APPLICABLE
  earthquake_hazard_zones:
    source: MEDIUM             # official DMR dataset (CC Attribution)
    methodology: MEDIUM        # probabilistic PGA (10% in 50 y, Sadigh et al. 1997) stated; PGA->MMI mapping, site and source model undocumented
    spatial_completeness: HIGH     # covers 99.97% of the AOI
    temporal_completeness: MEDIUM  # fixed 50-year exposure window; data year not stated
  historical_seismicity:
    source: MEDIUM             # DMR inventory, TMD felt list, USGS composite catalogue
    methodology: LOW           # felt/effects lists mixed with instrumental data; not deduplicated
    spatial_completeness: LOW
    temporal_completeness: LOW # instrumental completeness ~M4.5 from the 1970s; chronicles earlier
  ground_response:
    source: NOT_ASSESSED
    methodology: NOT_ASSESSED
    spatial_completeness: NOT_ASSESSED
    temporal_completeness: NOT_APPLICABLE
decision_confidence: LOW       # regional-screening confidence stays LOW: ground response unassessed

# Ground response is not assessed. This limits claims (no parcel/site seismic safety) but does
# not make REGIONAL screening unusable.
ground_response:
  status: NOT_ASSESSED
  available_evidence: []       # slope or flatness is NOT ground-response evidence
  missing_evidence:
    - local_geology_and_ground_material
    - sediment_thickness_and_basin_effects
    - site_amplification_and_vs30
    - liquefaction_susceptibility
    - parcel_level_geotechnical_conditions
    - building_design_and_code_zone

# Columns the seismic interpretation may never read.
prohibited_evidence_columns:
  - slope_p90_deg
  - slope_stratum
  - lowland_stratum
  - slope_stratum_reporting_only
  - regional_search_status
  - flood_fusion_state
  - landslide_class5_fraction
  - hazard_interpretation

reason_codes:
  MODELLED_HAZARD_TOP_CLASS_DOMINANT: "DMR probabilistic PGA hazard zones (10% in 50 years, shown as MMI): class {top_class} covers >= {model_strong_fraction:.0%} of the cell (PGA-to-MMI mapping undocumented)"
  MODELLED_HAZARD_TOP_CLASS_PRESENT: "DMR hazard zone class {top_class} covers >= {model_verify_fraction:.0%} of the cell (below the dominant share)"
  BORDERLINE_ESCALATED_BY_CORROBORATING_SIGNALS: "A borderline modelled-hazard share is escalated because {escalation_signals} corroborating signals are present (fault very near and a nearby recorded event); corroboration, not independent confirmation"
  FAULT_TRACE_WITHIN_VERIFY_DISTANCE: "A mapped DMR active-fault trace lies within {fault_verify_km:g} km of the cell (context only; distance is not shaking or risk)"
  FAULT_TRACE_VERY_NEAR: "A mapped active-fault trace lies within {fault_strong_km:g} km (corroborating signal; cannot create strong concern alone)"
  HISTORICAL_EVENT_NEAR: "A historical earthquake of M >= {history_magnitude:g} was recorded within {history_tier1_km:g} km (corroborating context)"
  HISTORICAL_EVENT_CORROBORATES: "A historical earthquake of M >= {history_magnitude:g} was recorded within {history_tier2_km:g} km (corroborating signal)"
  SHAKING_ZONE_NOT_ASSESSED: "DMR hazard zones cover only part of the cell"
  GROUND_RESPONSE_NOT_ASSESSED: "Site effects (ground material, sediment, amplification, liquefaction) are not assessed: regional screening only, not a site assessment"
  NO_NEARBY_HISTORICAL_EVENT_RECORDED: "No qualifying historical event is recorded nearby (the catalogues are incomplete; this is not evidence of low seismic hazard)"
  MODELLED_HAZARD_BELOW_TIER: "The DMR hazard zone class {top_class} covers less than {model_verify_fraction:.0%} of the cell (still not evidence of low hazard)"
