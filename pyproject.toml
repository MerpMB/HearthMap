[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "hearthmap"
version = "0.0.1"
description = "Decision-support and geospatial site-selection for a long-term family home in Northern Thailand."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Raster support is deliberately optional until a raster layer (e.g. DEM) is actually ingested.
raster = ["rasterio>=1.3"]
# Static review figures (M1A.1 QA package).
review = ["matplotlib>=3.8", "pyarrow>=15"]

[project.scripts]
hearthmap = "hearthmap.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Markdown table rows in the generated report are long by nature.
"scripts/m1a/package.py" = ["E501"]
# Generated Markdown prose/tables (contains typographic symbols such as x and en dashes).
"scripts/m1a1/write_readme.py" = ["E501", "RUF001"]
