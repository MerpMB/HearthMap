    by ICRC, configured by ITOS); contributed by OCHA ROAP'
  dataset_title: Thailand - Subnational Administrative Boundaries (COD-AB) dataset version 01
  landing_page: https://data.humdata.org/dataset/cod-ab-tha
  data_endpoint: https://data.humdata.org/dataset/d24bdc45-eb4c-4e3d-8b16-44db02667c27/resource/ccbf3740-0638-48ea-b612-cdb61ef5462c/download/tha_admin_boundaries.gdb.zip
  access_method: Anonymous HTTPS download (302 redirect to a signed S3 URL)
  access_restrictions: None observed
  format: Esri File Geodatabase in ZIP (174,679,979 bytes); layers tha_admin0..3, adminlines, adminpoints
  source_crs: EPSG:4326
  coverage: 'Thailand: 77 provinces, 928 districts, 7,425 sub-districts'
  spatial_resolution: Vector; mapping scale not published
  temporal_coverage: Boundaries created 2022-01-01; valid_on 2022-01-22; reviewed 2025-10-30
  last_update: Resources modified 2026-01-26; package metadata modified 2026-08-14
  last_verified: '2026-10-15'
  verification_evidence: HDX CKAN package_show inspected; geodatabase downloaded (sha256 09e62345...6e0d8)
    and opened with GDAL; AOI codes TH50/TH56/TH57 and district counts 25/18/9 confirmed; topology and
    reference comparisons in docs/research/m1a-validation-report.md
  redirects_or_changes: Download URL redirects to signed S3. File names changed since 2022 (THA_AdminBoundaries_candidate.gdb.zip
    / tha_adm_rtsd_itos_20210121_SHP.zip -> tha_admin_boundaries.*); GeoJSON (437 MB) and SHP (377 MB)
    variants also offered.
  license_or_usage_notes: CC BY-IGO per HDX package (license_id cc-by-igo). Some third-party mirrors (Open
    Development Mekong) describe use as 'humanitarian use only' - discrepancy recorded; HDX licence taken
    as authoritative for this version.
  expected_update_frequency: Yearly (HDX data_update_frequency 365)
  confidence: MEDIUM
  known_limitations:
  - Administrative, not cadastral/legal parcel boundaries.
  - Mapping scale and positional accuracy not published.
  - 'Compared with GISTDA 1:50k: median boundary offset ~31-37 m, but p95 1.1 km and max 4.9 km in Chiang
    Mai.'
  - 'HDX caveat: one Thai district name (Pom Prap Sattru Phai) incorrect in ADM2_TH.'
  analytical_suitability: AOI definition and grid generation; not legal boundary evidence.
  local_raw_path: data/raw/boundaries-ocha-cod-ab/2026-01-26/
  processing_status: PROCESSED
  notes: 'Chosen PRIMARY: documented lineage from a Thai government mapping agency (RTSD), explicit open
    licence, full admin hierarchy with stable P-codes.'
