    temporal_coverage: Derived from Copernicus DEM
    last_verified: null
    license_or_usage_notes: Believed non-commercial licence (CC BY-NC-SA) - must confirm before use
    expected_update_frequency: Static
    confidence: UNKNOWN
    known_limitations:
      - Machine-learning correction; errors in dense forest remain.
    local_raw_path: null
    processing_status: NOT_ACQUIRED
    notes: Possibly better bare-earth proxy for slope; licence is the key question.

