# HearthMap data-source registry (machine-readable).
#
# Validated by `hearthmap check-registry` (hearthmap.provenance.registry).
# Human guide: data-source-registry.md
#
# M1A state (2026-10-15): entries marked VERIFIED were inspected at the source
# (metadata read AND data downloaded/opened, or for blocked sources the access
# path itself checked). A working URL alone is never verification. Everything
# else remains CANDIDATE or NEEDS_RESEARCH and must not be cited as fact.
#
# verification_status: VERIFIED | CANDIDATE | NEEDS_RESEARCH
# role: PRIMARY | SECONDARY | VALIDATION_ONLY
# metadata_verified / data_verified: catalogue/access checked vs data itself opened
# acquisition_status: NOT_STARTED | ACQUIRED | DEFERRED | BLOCKED_CREDENTIAL_REQUIRED | BLOCKED_SIZE_GUARD
# permitted_uses: REGIONAL_SCREENING | POTENTIAL_HARD_EXCLUSION | LEGAL_WARNING_ONLY |
#                 PARCEL_LEGAL_VERIFICATION | VALIDATION_REFERENCE
# source_state (M2A.2): SOURCE_EXISTS_AGENT_ACCESSIBLE | SOURCE_EXISTS_AGENT_BLOCKED | SOURCE_MANUALLY_ACQUIRED | SOURCE_UNAVAILABLE
#   (a source the agent cannot reach is NOT unavailable; acquisition_path says how the project user can supply it)
# availability (M2A.3): AVAILABLE | TEMPORARILY_UNREACHABLE | BLOCKED_FOR_AGENT | PERMANENTLY_UNAVAILABLE (+ last_access_attempt when unreachable)
# priority: must_have | useful | later
# processing_status: NOT_ACQUIRED | ACQUIRED | PROCESSING | PROCESSED | REJECTED
# confidence: HIGH | MEDIUM | LOW | UNKNOWN  (quality of the dataset itself)

