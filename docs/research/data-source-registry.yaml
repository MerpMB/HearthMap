# HearthMap data-source registry (machine-readable).
#
# Validated by `hearthmap check-registry` (hearthmap.provenance.registry).
# Human guide: data-source-registry.md
#
# IMPORTANT — M0 state: NOTHING here is VERIFIED. Entries are drawn from
# background knowledge of commonly used sources and have not been checked for
# current availability, URL, licence, coverage or quality. URLs, where given,
# have not been visited in M0. Every factual-looking field must be re-checked
# before a source moves to VERIFIED.
#
# verification_status: VERIFIED | CANDIDATE | NEEDS_RESEARCH
#   CANDIDATE       = believed to exist and be relevant; details unverified
#   NEEDS_RESEARCH  = unclear whether a usable public dataset exists
# priority: must_have | useful | later
# processing_status: NOT_ACQUIRED | ACQUIRED | PROCESSING | PROCESSED | REJECTED
# confidence: HIGH | MEDIUM | LOW | UNKNOWN  (quality of the dataset itself; UNKNOWN until inspected)

schema_version: 1
sources:

