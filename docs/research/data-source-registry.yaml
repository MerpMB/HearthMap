- id: dem-copernicus-glo30
  name: Copernicus DEM GLO-30
  category: elevation
  priority: must_have
  verification_status: VERIFIED
  role: PRIMARY
  metadata_verified: true
  data_verified: true
  acquisition_status: ACQUIRED
  permitted_uses:
  - REGIONAL_SCREENING
  publisher: ESA / Copernicus programme (TanDEM-X data, DLR & Airbus); AWS copy managed by Sinergise
  dataset_title: Copernicus DEM GLO-30 Public (Digital Surface Model)
  landing_page: https://registry.opendata.aws/copernicus-dem/
  data_endpoint: https://copernicus-dem-30m.s3.amazonaws.com/<tile>/<tile>.tif
  access_method: Anonymous HTTPS GET from the AWS Open Data bucket (verified, no account). Copernicus
    Data Space Ecosystem access requires registration.
  access_restrictions: None for the AWS copy; some countries' GLO-30 tiles withheld (not Thailand)
  format: Cloud-optimised GeoTIFF, Float32, 1x1 degree tiles (~45 MB each)
  source_crs: EPSG:4326 (WGS84-G1150) + EGM2008 heights (EPSG:3855)
  coverage: Global (AOI fully covered by 9 tiles, 0 nodata pixels inside AOI)
  spatial_resolution: 1 arc-second (~30 m)
  temporal_coverage: TanDEM-X acquisitions 2011-2015
  last_update: AWS objects dated 2022-05-09 (2021 release); CDSE lists releases to 2024_1 with changes
    for other regions only
  last_verified: '2026-10-15'
  verification_evidence: AWS registry YAML and Copernicus Data Space collection page read; anonymous HEAD/GET
    of 16 candidate tiles; 9 AOI tiles downloaded, opened with rasterio, AOI stats computed (min 205.2
    m, max 2,579.7 m, nodata 0).
  redirects_or_changes: OpenTopography moved to the ESA-hosted 2023_1 version in 2024; not used here.
  license_or_usage_notes: 'Copernicus DEM licence: GLO-30 Public free for the general public; attribution
    notice required when distributing.'
  expected_update_frequency: Static (occasional releases)
  confidence: MEDIUM
  known_limitations:
  - Digital SURFACE model - includes tree canopy and buildings; inflates heights in forest and biases
    slope.
  - Stated absolute vertical accuracy < 4 m (90% LE) is a global figure; worse expected in steep forested
    terrain.
  analytical_suitability: Regional terrain preview; not yet fit for a slope hard constraint (ADR-0008).
  local_raw_path: data/raw/dem-copernicus-glo30/aws-2021-release/
  processing_status: PROCESSED
  notes: Reproject to EPSG:32647 before deriving slope.
