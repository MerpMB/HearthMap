  # ----------------------------------------------------------------- elevation
  - id: dem-copernicus-glo30
    name: Copernicus DEM GLO-30
    category: elevation
    priority: must_have
    verification_status: CANDIDATE
    publisher: European Space Agency / Copernicus programme
    landing_page: null
    access_method: Download (several mirrors incl. public cloud buckets; to confirm)
    format: Cloud-optimised GeoTIFF tiles
    coverage: Global
    spatial_resolution: ~30 m (1 arc-second)
    temporal_coverage: Acquisitions roughly 2011-2015 (to confirm)
    last_verified: null
    license_or_usage_notes: To confirm (Copernicus DEM licence)
    expected_update_frequency: Static
    confidence: UNKNOWN
    known_limitations:
      - Digital SURFACE model - includes tree canopy and buildings; inflates heights in forest and biases slope.
      - Vertical accuracy degrades in steep, forested terrain typical of the north.
    local_raw_path: null
    processing_status: NOT_ACQUIRED
    notes: Reproject to EPSG:32647 before deriving slope.

  - id: dem-fabdem
    name: FABDEM (Forest And Buildings removed Copernicus DEM)
